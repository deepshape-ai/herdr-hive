id = "herdr.bee"
name = "Herdr Bee"
version = "0.4.0-dev"
min_herdr_version = "0.9.0"
description = "Share selected Herdr sessions with your team through Hive"
platforms = ["linux", "macos"]

[[build]]
command = ["go", "build", "-trimpath", "-ldflags", "-s -w -X main.version=0.4.0-dev", "-o", "bee", "../cmd/bee"]

[[startup]]
command = ["./bee", "restore"]

[[actions]]
id = "configure"
title = "Bee: configure sharing"
command = ["./bee", "open"]

[[actions]]
id = "enable"
title = "Bee: enable sharing"
command = ["./bee", "enable"]

[[actions]]
id = "disable"
title = "Bee: disable sharing"
command = ["./bee", "disable"]

[[actions]]
id = "update"
title = "Bee: update to latest stable release"
command = ["./bee", "update"]

[[panes]]
id = "settings"
title = "Bee"
placement = "split"
command = ["./bee", "tui"]
