name: Release
on:
  push:
    tags: ['hive/v*', 'bee/v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.parse.outputs.component }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^(hive|bee)/v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo 'Expected hive/vX.Y.Z or bee/vX.Y.Z, optionally with a prerelease suffix' >&2
            exit 1
          fi
          echo "component=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
  checks:
    needs: metadata
    uses: ./.github/workflows/ci.yml
  build:
    needs: [metadata, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ${{ needs.metadata.outputs.component }}/go.mod
          cache-dependency-path: ${{ needs.metadata.outputs.component }}/go.sum
      - name: Package this component
        env:
          COMPONENT: ${{ needs.metadata.outputs.component }}
          VERSION: ${{ needs.metadata.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: make "package-$COMPONENT" VERSION="$VERSION" GOOS="$GOOS" GOARCH="$GOARCH"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ needs.metadata.outputs.component }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ needs.metadata.outputs.component }}-${{ needs.metadata.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 5
  publish:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-${{ needs.metadata.outputs.component }}-*
          merge-multiple: true
          path: release
      - name: Verify complete artifact set and generate checksums
        working-directory: release
        env:
          COMPONENT: ${{ needs.metadata.outputs.component }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          component, version = os.environ['COMPONENT'], os.environ['VERSION']
          expected = {f'{component}-{version}-{system}-{arch}.tar.gz'
                      for system in ('linux', 'darwin') for arch in ('amd64', 'arm64')}
          actual = {p.name for p in Path('.').iterdir()}
          if actual != expected:
              raise SystemExit(f'Unexpected release artifacts: {actual ^ expected}')
          Path('SHA256SUMS').write_text(''.join(
              f'{hashlib.sha256(Path(name).read_bytes()).hexdigest()}  {name}\n'
              for name in sorted(expected)))
          PY
      - name: Publish the existing tag
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMPONENT: ${{ needs.metadata.outputs.component }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          notes=(--generate-notes)
          notes_file="$GITHUB_WORKSPACE/docs/releases/$COMPONENT-$VERSION.md"
          if [[ -f "$notes_file" ]]; then notes=(--notes-file "$notes_file"); fi
          gh release create "$TAG" ./*.tar.gz SHA256SUMS \
            --verify-tag --title "$COMPONENT v$VERSION" \
            --latest=false "${notes[@]}" "${flags[@]}"
