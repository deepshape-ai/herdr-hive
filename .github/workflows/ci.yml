name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: sh -n install.sh
      - run: python3 -B tests/test_install.py
  test:
    strategy:
      fail-fast: false
      matrix:
        component: [hive, bee, internal/update]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ${{ matrix.component }}/go.mod
          cache-dependency-path: '**/go.mod'
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -timeout 2m ./...
      - run: go build ./...
      - name: Verify marketplace build and entrypoints
        if: matrix.component == 'bee'
        working-directory: bee/plugin
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, tomllib
          path = pathlib.Path('herdr-plugin.toml')
          original = path.read_bytes()
          manifest = tomllib.loads(original.decode())
          for entry in manifest['build']:
              subprocess.run(entry['command'], check=True)
          assert path.read_bytes() == original, 'build modified the manifest'
          version = subprocess.check_output(['./bee', 'version'], text=True).strip()
          assert version == manifest['version'], (version, manifest['version'])
          for section in ('startup', 'actions', 'panes'):
              for entry in manifest[section]:
                  assert os.access(entry['command'][0], os.X_OK), entry
          print('Marketplace build, version and executable entrypoints verified')
          PY
  native:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        herdr: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["0.9.0","latest"]' || '["0.9.0","0.9.1","0.9.2","0.9.3"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: hive/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Resolve the official native integration target
        env:
          HERDR_TARGET: ${{ matrix.herdr }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          pins = {
              '0.9.0': '4fa1a01158dd8043da92d31b270780b0dcc10603038d9b61cac4d81ab63fb71f',
              '0.9.1': '2a02fed16beb651ef006e1d43f048f652ca4dc58ad053cd2d44450563d5c54b7',
              '0.9.2': '74de34746f96236f76d599f8f5d2439f884351eabe25b7495e0edab75414064a',
              '0.9.3': '18a8dc65f1c2fa485884344356dea1cfd911c6f06cf46fa78e193f4087f4dba7',
          }
          version = os.environ['HERDR_TARGET']
          if version == 'latest':
              request = urllib.request.Request(
                  'https://api.github.com/repos/herdrdev/herdr/releases/latest',
                  headers={'Accept': 'application/vnd.github+json',
                           'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
              with urllib.request.urlopen(request, timeout=30) as response:
                  release = json.load(response)
              assert not release['draft'] and not release['prerelease'], 'Stable release required'
              version = release['tag_name'].removeprefix('v')
              assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version), 'Invalid stable version'
              assert tuple(map(int, version.split('.'))) >= (0, 9, 0), 'Herdr 0.9.0+ required'
              asset = next(a for a in release['assets'] if a['name'] == 'herdr-linux-x86_64')
              digest = asset.get('digest') or ''
              assert re.fullmatch(r'sha256:[0-9a-f]{64}', digest), 'Official SHA-256 required'
              checksum = digest.removeprefix('sha256:')
          else:
              checksum = pins[version]
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'HERDR_VERSION={version}\nHERDR_SHA256={checksum}\n')
          print(f'Native target: Herdr {version}, SHA-256 {checksum}')
          PY
      - name: Install the verified native integration target
        run: |
          mkdir -p .local/bin
          curl --fail --location --retry 3 "https://github.com/herdrdev/herdr/releases/download/v${HERDR_VERSION}/herdr-linux-x86_64" -o .local/bin/herdr
          echo "$HERDR_SHA256  .local/bin/herdr" | sha256sum --check
          chmod 755 .local/bin/herdr
          echo "$PWD/.local/bin" >> "$GITHUB_PATH"
          python3 -m venv .local/venv
          .local/venv/bin/pip install -r tests/integration/requirements.txt
      - run: make package VERSION=0.1.0-ci
      - run: .local/venv/bin/python tests/integration/native.py
      - run: python3 -B tests/integration/remote_cli.py
      - run: python3 tests/integration/panel.py
