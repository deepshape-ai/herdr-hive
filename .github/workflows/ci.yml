name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: sh -n install.sh
      - run: python3 -B tests/test_install.py
  test:
    strategy:
      fail-fast: false
      matrix:
        component: [hive, bee, internal/update]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ${{ matrix.component }}/go.mod
          cache-dependency-path: '**/go.mod'
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - name: Verify marketplace build and entrypoints
        if: matrix.component == 'bee'
        working-directory: bee/plugin
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, tomllib
          path = pathlib.Path('herdr-plugin.toml')
          original = path.read_bytes()
          manifest = tomllib.loads(original.decode())
          for entry in manifest['build']:
              subprocess.run(entry['command'], check=True)
          assert path.read_bytes() == original, 'build modified the manifest'
          version = subprocess.check_output(['./bee', 'version'], text=True).strip()
          assert version == manifest['version'], (version, manifest['version'])
          for section in ('startup', 'actions', 'panes'):
              for entry in manifest[section]:
                  assert os.access(entry['command'][0], os.X_OK), entry
          print('Marketplace build, version and executable entrypoints verified')
          PY
  native:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: hive/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Install the pinned native integration target
        env:
          HERDR_SHA256: 4fa1a01158dd8043da92d31b270780b0dcc10603038d9b61cac4d81ab63fb71f
        run: |
          mkdir -p .local/bin
          curl --fail --location --retry 3 https://github.com/herdrdev/herdr/releases/download/v0.9.0/herdr-linux-x86_64 -o .local/bin/herdr
          echo "$HERDR_SHA256  .local/bin/herdr" | sha256sum --check
          chmod 755 .local/bin/herdr
          echo "$PWD/.local/bin" >> "$GITHUB_PATH"
          python3 -m venv .local/venv
          .local/venv/bin/pip install -r tests/integration/requirements.txt
      - run: make package VERSION=0.1.0-ci
      - run: .local/venv/bin/python tests/integration/native.py
      - run: python3 tests/integration/panel.py
